<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, user-scalable=no"
        />
        <meta name="referrer" content="no-referrer" />
        <meta http-equiv="Cache-Control" content="no-cache" />

        <title>VRCX</title>

        <link rel="preconnect" href="https://api.vrchat.cloud" />
        <link rel="preconnect" href="https://files.vrchat.cloud" />
        <link rel="preconnect" href="https://d348imysud55la.cloudfront.net" />
        <link rel="dns-prefetch" href="https://assets.vrchat.com" />
    </head>
    <body>
        <div id="root"></div>
        <script>
            // Expose Electron IPC globals for ES module compatibility.
            var _globalStore = {};
            [
                'AppApi',
                'WebApi',
                'VRCXStorage',
                'SQLite',
                'LogWatcher',
                'Discord',
                'AssetBundleManager'
            ].forEach(function (name) {
                Object.defineProperty(globalThis, name, {
                    get: function () {
                        return _globalStore[name];
                    },
                    set: function (v) {
                        _globalStore[name] = v;
                    },
                    configurable: true,
                    enumerable: true
                });
            });
        </script>
        <script type="module" src="app.js"></script>
    </body>
</html>
